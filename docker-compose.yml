services:
  detector:
    build: .
    container_name: rocky_detector
    restart: always
    env_file: .env
    # Share the host's network so MICROSERVICE_URL=http://localhost:4000 reaches rocky-monitor on the Pi
    network_mode: host
    # Cap stored logs so they can't fill the SD card
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
